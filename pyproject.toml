[project]
name = "flask-unchained"
version = "0.10.0a2"
description = "The quickest and easiest way to build web apps and APIs with Flask"
authors = [{ name = "Brian Cappello", email = "briancappello@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "blinker>=1.4.0,<2",
    "click>=8.0,<9",
    "flask>=2.2",
    "flask-babel>=4.0.0,<5",
    "flask-wtf>=1.2.1,<2",
    "py-meta-utils>=0.8.0,<0.9",
    "pyterminalsize>=0.1.0,<0.2",
    "networkx>=2.5",
    "email-validator>=2.1.0.post1,<3",
    "speaklater>=1.3,<2",
    "setuptools>=69.0.3,<70",
]

[project.optional-dependencies]
admin = ["flask-admin>=1.6.1,<2"]
api = [
    "apispec>=6.4.0,<7",
    "apispec-webframeworks>=1.0.0,<2",
    "flask-marshmallow>=1.2.0,<2",
    "marshmallow>=3.20.2,<4",
    "marshmallow-sqlalchemy>=1.0.0,<2",
]
quart = ["quart>=0.19.4,<0.20"]
celery = [
    "dill>=0.3.8,<0.4",
    "celery>=5.3.6,<6",
]
graphene = [
    "graphql-core>=2.3.1,<3",
    "graphql-relay>=2.0.1,<3",
    "graphql-server-core>=1.2,<2",
    "flask-graphql>=2.0.1,<3",
    "graphene>=2.1.9,<3",
    "graphene-sqlalchemy>=2.2,<3",
]
mail = [
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=5.1.0,<6",
]
oauth = ["flask-oauthlib>=0.9.6,<0.10"]
security = [
    "bcrypt>=4.0,<4.1",
    "flask-login>=0.6.3,<0.7",
    "flask-principal>=0.4.0,<0.5",
    "itsdangerous>=2.1.2,<3",
    "passlib>=1.7.4,<2",
]
session = [
    "dill>=0.3.8,<0.4",
    "flask-session>=0.6.0,<0.7",
]
sqlalchemy = [
    "flask-migrate>=4.0.5,<5",
    "flask-sqlalchemy>=3.0,<3.1",
    "flask-sqlalchemy-unchained>=0.8.0,<0.9",
    "sqlalchemy>=1.4,<2",
    "wtforms-sqlalchemy>=0.4.1,<0.5",
]

[project.urls]
Repository = "https://github.com/briancappello/flask-unchained"

[project.scripts]
fun = "flask_unchained.cli:main"
flask = "flask_unchained.cli:main"

[project.entry-points.pytest11]
flask_unchained = "flask_unchained.pytest"

[dependency-groups]
dev = [
    "black>=24.1.1,<25",
    "ipython>=8.21.0,<9",
    "factory-boy>=3.3.0,<4",
    "pytest>=7.0.0,<8",
    "pytest-flask>=1.3.0,<2",
    "tox>=4.12.1,<5",
    "psycopg2>=2.9.9,<3",
    "isort>=5.13.2,<6",
]
docs = [
    "ipython>=8.21.0,<9",
    "sphinx>=7.2.6,<8",
    "sphinx-click>=5.1.0,<6",
    "sphinx-material>=0.0.36,<0.0.37",
    "m2r2>=0.3.3.post2,<0.4",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.hatch.build.targets.sdist]
include = [
    "flask_unchained",
    "flask_mail.py",
    "unchained_config.py",
]

[tool.hatch.build.targets.sdist.force-include]
flask_unchained = "flask_unchained"
"CHANGELOG.md" = "CHANGELOG.md"
LICENSE = "LICENSE"

[tool.hatch.build.targets.wheel]
include = [
    "flask_unchained",
    "flask_mail.py",
    "unchained_config.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 90
target-version = ['py310']
preview = true
extend-exclude = "flask_unchained/_code_templates"

[tool.isort]
profile = "black"
include_trailing_comma = true
lines_between_types = 1
lines_after_imports = 2
multi_line_output = 3
extend_skip = [
    "flask_unchained/_code_templates",
]
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
known_first_party = [
    "flask_sqlalchemy_unchained",
    "py_meta_utils",
    "sqlalchemy_unchained",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
markers = [
    "bundles: mark test(s) as using a specific list of bundles",
    "role: mark to customize RoleFactory arguments for a single Role",
    "roles: mark to customize RoleFactory arguments for multiple Roles",
    "user: mark to customize UserFactory arguments for a single User",
    "users: mark to customize UserFactory arguments for multiple Users",
]
filterwarnings = [
    "ignore:the imp module is deprecated in favour of importlib:DeprecationWarning",
    "ignore:The create_engine.convert_unicode parameter:sqlalchemy.exc.SADeprecationWarning",
    "ignore:Use .persist_selectable:sqlalchemy.exc.SADeprecationWarning",
]
